name: Daily sync

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC == 05:00 CET / 06:00 CEST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        id: sync
        run: python scripts/sync_confluence.py --out . --github-output "$GITHUB_OUTPUT"

      - name: Convert to Markdown
        run: python scripts/convert_to_markdown.py --out .

      - name: Commit changes
        env:
          UPDATED: ${{ steps.sync.outputs.updated }}
          NEW: ${{ steps.sync.outputs.new }}
          REMOVED: ${{ steps.sync.outputs.removed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "sync: ${DATE} (${UPDATED} updated, ${NEW} new, ${REMOVED} removed)"
          git push
