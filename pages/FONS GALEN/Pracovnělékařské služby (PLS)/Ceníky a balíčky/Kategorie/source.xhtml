<title>Kategorie</title>
<body><p>Okno pro vytv&aacute;řen&iacute; kategori&iacute;. Slouž&iacute; ke shlukov&aacute;n&iacute; a lepš&iacute; filtrov&aacute;n&iacute; položek cen&iacute;ku.</p><ac:image ac:align="center" ac:layout="center" ac:original-height="298" ac:original-width="959" ac:custom-width="true" ac:alt="image-20250626-133802.png" ac:width="760"><ri:attachment ri:filename="image-20250626-133802.png" ri:version-at-save="1" /></ac:image><p>Do kategori&iacute; je n&aacute;sledně možn&eacute; přiřadit jednotliv&eacute; položky cen&iacute;ku (sortiment). Kategorie se zobrazuj&iacute; při v&yacute;běru sortimentu (při přid&aacute;v&aacute;n&iacute; položek na prohl&iacute;dku a v okně Stav &uacute;čtu).</p></body>
